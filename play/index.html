<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#0d0b1e">
	<meta name="color-scheme" content="dark">
	<meta name="description" content="Luxel: sell the game's own settings to keep the last lantern lit. A Godot game for a jam on the theme Trade-off.">
	<title>Luxel</title>
	<style>
:root {
	--void: #0d0b1e;
	--night: #211a3b;
	--mauve: #8a6e91;
	--stone: #c2a7ae;
}
html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: var(--void);
}
body {
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}
#stage {
	position: fixed;
	inset: 0;
	overflow: hidden;
	background: var(--void);
}
#frame {
	position: absolute;
	left: 0;
	top: 0;
	width: 0;
	height: 0;
	background: var(--void);
}
#frame > canvas {
	position: absolute;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
	display: block;
	image-rendering: -moz-crisp-edges;
	image-rendering: pixelated;
}
#canvas:focus {
	outline: none;
}
#loader.gate {
	cursor: pointer;
}
#loader.out {
	opacity: 0;
	transition: opacity 0.35s linear;
	pointer-events: none;
}
#hint {
	position: absolute;
	display: none;
	pointer-events: none;
	image-rendering: -moz-crisp-edges;
	image-rendering: pixelated;
}
#fs {
	position: absolute;
	display: none;
	margin: 0;
	padding: 0;
	border: 0;
	background: var(--night);
	cursor: pointer;
	opacity: 1;
	transition: opacity 0.3s linear;
}
#fs.idle {
	opacity: 0;
}
#fs canvas {
	display: block;
	width: 100%;
	height: 100%;
	image-rendering: -moz-crisp-edges;
	image-rendering: pixelated;
}
noscript p {
	position: fixed;
	inset: 0;
	margin: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	color: var(--stone);
	font: 16px/1.4 ui-monospace, Menlo, Consolas, monospace;
}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<div id="stage">
		<div id="frame">
			<canvas id="canvas" tabindex="0">Luxel needs a browser with canvas support.</canvas>
			<canvas id="loader" width="320" height="180"></canvas>
		</div>
		<canvas id="hint" width="1" height="5"></canvas>
		<button id="fs" type="button" tabindex="-1" aria-label="Fullscreen" title="Fullscreen"><canvas width="9" height="9"></canvas></button>
	</div>
	<noscript><p>Luxel needs JavaScript to run.</p></noscript>

	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":19193640,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;

(function () {
	'use strict';
	// The game is drawn at 320x180 and shown at a whole multiple of it (device pixels), centred on void.
	const BASE_W = 320;
	const BASE_H = 180;
	const PAL = {
		void: '#0d0b1e', night: '#211a3b', dusk: '#3d2c5c', plum: '#6a3d6f', wine: '#a0466a', coral: '#e2725b',
		apricot: '#f5a96a', gold: '#ffd98c', cream: '#fff4dc', mauve: '#8a6e91', stone: '#c2a7ae',
	};
	// Generated by web/make_icon.py from art/ui/font.png and the icon's lantern: don't edit by hand.
	// FONT-BEGIN
		const FONT_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!-:x/.+=';
		const FONT_BITS = [23530, 15083, 25166, 15211, 29391, 4815, 27470, 23533, 29847, 11044, 23277, 29257, 23549, 23403, 11114, 4843, 26474, 23275, 14478, 9367, 31597, 11117, 24557, 23213, 9389, 29351, 31599, 29850, 29347, 14499, 18925, 14543, 31694, 9383, 31727, 14831, 8338, 448, 1040, 21824, 4772, 8192, 1488, 3640];
	// FONT-END
	// LANTERN-BEGIN
		const LANTERN = [
		'................................',
		'.............N.N.N.N............',
		'..........N.N.N.N.N.N.N.........',
		'.........N.NNDvvvvND.N.N........',
		'......N.N.DNDvssmmvNDNN.N.......',
		'.....N.NNDNDvsvvvvdvNDND.N......',
		'....N.NNDNDDvmvvvvnvPNDND.N.....',
		'...N.NNDNDDvvmmdddnvvPNDND.N....',
		'....NNDNPDvmmmmmmdddnvPDDND.N...',
		'...NNDNDDvmddddddddddnvPNDND.N..',
		'..N.DNDDPvnnnnnnnnnnnnvDPNDNN...',
		'.N.DNDDPDvm1111111111nvPDPNDNN..',
		'..NNDNPDPvm1222222221nvDPDDND.N.',
		'.N.DNPDPPvm1222332221nvWDPDDNN..',
		'..NNDDPDWvm1222332221nvPPDPND.N.',
		'.N.DNPDPPvd1223333221nvWDPDDNN..',
		'..NNDDPDWvd1223333221nvPPDPND.N.',
		'.N.DNPDPPvd1223333221nvWDPDDNN..',
		'..NNDDPDWvd1222332221nvPPDPND.N.',
		'.N.DNPDPPvd1222222221nvWDPDDNN..',
		'..NNDNPDPvd1222222221nvDPDDND.N.',
		'.N.DNDDPDvd1111111111nvPDPNDNN..',
		'..N.DNDDPvmddddddddddnvDPNDNN...',
		'...NNDNDDPvmddddddddnvDPNDND.N..',
		'....NNDNPDPvnnnnnnnnvDPDDND.N...',
		'...N.NNDNDDPvvvvvvvvDPNDND.N....',
		'....N.NNDNDDPDPDPDPDPNDND.N.....',
		'.....N.NNDNDNDNDNDNDNDND.N......',
		'......N.N.DNDNDNDNDNDNN.N.......',
		'.........N.NNDNDNDND.N.N........',
		'..........N.N.N.N.N.N.N.........',
		'.............N.N.N.N............',
		];
	// LANTERN-END
	const EXTRA_GLYPHS = { '%': 21157 };
	const BODY = { v: PAL.void, n: PAL.night, d: PAL.dusk, m: PAL.mauve, s: PAL.stone };
	const GLASS_LIT = { 1: PAL.apricot, 2: PAL.gold, 3: PAL.cream };
	const HALO = { W: PAL.wine, P: PAL.plum, D: PAL.dusk, N: PAL.night };
	// Luxel looks (scripts/game/ui/luxels.gd): body, lit edges (top, left), shaded edges (bottom, right).
	const UNLIT = [PAL.dusk, PAL.plum, PAL.night];
	const EMBER = [PAL.coral, PAL.apricot, PAL.wine];
	const DIM = [PAL.apricot, PAL.gold, PAL.coral];
	const LIT = [PAL.gold, PAL.cream, PAL.apricot];
	const FLASH = [PAL.cream, PAL.cream, PAL.gold];
	const HINT = [
		['ARROWS / WASD', PAL.stone], [' MOVE   ', PAL.mauve], ['SPACE', PAL.stone], [' SELECT   ', PAL.mauve],
		['ESC', PAL.stone], [' PAUSE   ', PAL.mauve], ['HOLD R', PAL.stone], [' RESTART', PAL.mauve],
	];
	const ICON_FULL = ['XX...XX', 'X.....X', '.......', '.......', '.......', 'X.....X', 'XX...XX'];
	const ICON_EXIT = ['..X.X..', 'XXX.XXX', '.......', '.......', '.......', 'XXX.XXX', '..X.X..'];

	const stage = document.getElementById('stage');
	const frame = document.getElementById('frame');
	const canvas = document.getElementById('canvas');
	const loader = document.getElementById('loader');
	const hint = document.getElementById('hint');
	const fsButton = document.getElementById('fs');
	const fsIcon = fsButton.querySelector('canvas');
	const ctx = loader.getContext('2d');

	const params = new URLSearchParams(window.location.search);
	const embedded = (function () {
		try {
			return window.self !== window.top;
		} catch (e) {
			return true;
		}
	}());
	const wantHint = params.get('hint') === '1' || (params.get('hint') !== '0' && !embedded);
	const touchOnly = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
	const fsEnabled = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);

	// --- Pixel text (the game's 3x5 font) ---------------------------------------------------------------------
	function glyph(ch) {
		const i = FONT_CHARS.indexOf(ch);
		return i >= 0 ? FONT_BITS[i] : (EXTRA_GLYPHS[ch] || 0);
	}
	function textWidth(text) {
		return Math.max(text.length * 4 - 1, 0);
	}
	function drawText(c, text, x, y, colour) {
		c.fillStyle = colour;
		for (let i = 0; i < text.length; i++) {
			const bits = glyph(text[i]);
			for (let gy = 0; gy < 5; gy++) {
				for (let gx = 0; gx < 3; gx++) {
					if (bits & (1 << (gy * 3 + gx))) {
						c.fillRect(x + i * 4 + gx, y + gy, 1, 1);
					}
				}
			}
		}
	}
	function drawCentred(c, text, cx, y, colour) {
		drawText(c, text, Math.round(cx - textWidth(text) / 2), y, colour);
	}

	// --- LUXEL in luxels, where the game's title draws it -------------------------------------------------------
	const LUX_X = Math.round(160 - (textWidth('LUXEL') * 5) / 2);
	const LUX_Y = 6;
	const cells = [];
	'LUXEL'.split('').forEach(function (ch, i) {
		const bits = glyph(ch);
		for (let x = 0; x < 3; x++) {
			for (let y = 0; y < 5; y++) {
				if (bits & (1 << (y * 3 + x))) {
					cells.push({ x: LUX_X + (i * 4 + x) * 5, y: LUX_Y + y * 5, litAt: -1 });
				}
			}
		}
	});
	function drawLuxel(x, y, look) {
		ctx.fillStyle = PAL.night;
		ctx.fillRect(x - 1, y - 1, 6, 6);
		ctx.fillStyle = look[0];
		ctx.fillRect(x, y, 4, 4);
		ctx.fillStyle = look[2];
		ctx.fillRect(x + 1, y + 3, 3, 1);
		ctx.fillRect(x + 3, y + 1, 1, 3);
		ctx.fillStyle = look[1];
		ctx.fillRect(x, y, 3, 1);
		ctx.fillRect(x, y, 1, 3);
	}
	function flicker(i, t) {
		const step = Math.floor(t / 0.14);
		const h = (Math.imul(i + 1, 73856093) ^ Math.imul(step + 7, 19349663)) >>> 0;
		return h % 1000 < 55 ? DIM : LIT;
	}

	// --- The lantern (the icon's art) -------------------------------------------------------------------------
	const LAN_X = 144;
	const LAN_Y = 72;
	function drawLantern(mode, ember) {
		for (let y = 0; y < LANTERN.length; y++) {
			const row = LANTERN[y];
			for (let x = 0; x < row.length; x++) {
				const c = row[x];
				let colour = null;
				if (BODY[c]) {
					colour = BODY[c];
				} else if (GLASS_LIT[c]) {
					if (mode === 'flash') {
						colour = PAL.cream;
					} else if (mode === 'lit') {
						colour = GLASS_LIT[c];
					} else {
						colour = c === '1' ? PAL.dusk : (c === '2' ? PAL.night : ember);
					}
				} else if (HALO[c] && mode !== 'dark') {
					colour = HALO[c];
				}
				if (colour) {
					ctx.fillStyle = colour;
					ctx.fillRect(LAN_X + x, LAN_Y + y, 1, 1);
				}
			}
		}
	}

	// --- Layout: the largest whole multiple of 320x180 that fits, in device pixels ------------------------------
	let layoutKey = '';
	let hintScale = 0;
	let fsInBand = false;
	function isFullscreen() {
		return !!(document.fullscreenElement || document.webkitFullscreenElement);
	}
	function layout() {
		const dpr = window.devicePixelRatio || 1;
		const box = stage.getBoundingClientRect();
		const dw = Math.floor(box.width * dpr + 0.01);
		const dh = Math.floor(box.height * dpr + 0.01);
		if (dw <= 0 || dh <= 0) {
			return;
		}
		const full = isFullscreen();
		const key = [dw, dh, dpr, full].join();
		if (key === layoutKey) {
			return;
		}
		layoutKey = key;
		let k = Math.floor(Math.min(dw / BASE_W, dh / BASE_H));
		let fw;
		let fh;
		if (k >= 2) {
			fw = BASE_W * k;
			fh = BASE_H * k;
		} else {
			// Smaller than 2x: the largest 16:9 fit, the game kept at 320x180 and stretched with nearest.
			k = 1;
			fw = Math.max(1, Math.min(dw, Math.floor((dh * 16) / 9)));
			fh = Math.max(1, Math.round((fw * 9) / 16));
		}
		const left = Math.floor((dw - fw) / 2);
		const top = Math.floor((dh - fh) / 2);
		frame.style.left = left / dpr + 'px';
		frame.style.top = top / dpr + 'px';
		frame.style.width = fw / dpr + 'px';
		frame.style.height = fh / dpr + 'px';
		const bw = BASE_W * k;
		const bh = BASE_H * k;
		if (canvas.width !== bw || canvas.height !== bh) {
			canvas.width = bw;
			canvas.height = bh;
		}

		// The controls hint sits in the bottom letterbox when there is room for it; it never costs a scale step.
		const band = dh - (top + fh);
		const tw = hint.width;
		const minScale = Math.ceil(2 * dpr);
		hintScale = 0;
		if (wantHint && !full) {
			const s = Math.min(k, Math.floor(fw / (tw + 24)), Math.floor(band / 9));
			if (s >= minScale) {
				hintScale = s;
			}
		}
		if (hintScale > 0) {
			const s = hintScale;
			const hy = top + fh + Math.floor((band - 5 * s) / 2);
			hint.style.display = 'block';
			hint.style.left = (left + Math.floor((fw - tw * s) / 2)) / dpr + 'px';
			hint.style.top = hy / dpr + 'px';
			hint.style.width = (tw * s) / dpr + 'px';
			hint.style.height = (5 * s) / dpr + 'px';
		} else {
			hint.style.display = 'none';
		}

		// The fullscreen button: in the hint band when it shows, else over the frame's top-right corner.
		if (!fsEnabled) {
			fsButton.style.display = 'none';
			return;
		}
		fsInBand = hintScale > 0;
		const bs = fsInBand ? hintScale : Math.max(2, Math.min(Math.round(3 * dpr), k + 1));
		const size = 9 * bs;
		const bx = left + fw - size - (fsInBand ? 0 : 2 * bs);
		const by = fsInBand ? top + fh + Math.floor((band - size) / 2) : top + 2 * bs;
		fsButton.style.display = 'block';
		fsButton.style.left = bx / dpr + 'px';
		fsButton.style.top = by / dpr + 'px';
		fsButton.style.width = size / dpr + 'px';
		fsButton.style.height = size / dpr + 'px';
		if (fsInBand) {
			fsButton.classList.remove('idle');
		} else {
			wake();
		}
		drawFsIcon();
	}

	function drawHint() {
		let text = '';
		HINT.forEach(function (part) {
			text += part[0];
		});
		hint.width = textWidth(text);
		hint.height = 5;
		const c = hint.getContext('2d');
		let x = 0;
		HINT.forEach(function (part) {
			drawText(c, part[0], x, 0, part[1]);
			x += part[0].length * 4;
		});
	}

	let fsHover = false;
	function drawFsIcon() {
		const c = fsIcon.getContext('2d');
		c.fillStyle = PAL.night;
		c.fillRect(0, 0, 9, 9);
		c.fillStyle = fsHover ? PAL.gold : PAL.stone;
		const map = isFullscreen() ? ICON_EXIT : ICON_FULL;
		for (let y = 0; y < 7; y++) {
			for (let x = 0; x < 7; x++) {
				if (map[y][x] === 'X') {
					c.fillRect(1 + x, 1 + y, 1, 1);
				}
			}
		}
	}

	// The overlay button hides once the game runs and the mouse rests.
	let idleTimer = 0;
	function wake() {
		fsButton.classList.remove('idle');
		clearTimeout(idleTimer);
		if (state === 'gone' || state === 'out') {
			idleTimer = setTimeout(function () {
				if (!fsInBand && !fsHover) {
					fsButton.classList.add('idle');
				}
			}, 2200);
		}
	}

	function focusGame() {
		try {
			canvas.focus({ preventScroll: true });
		} catch (e) {
			canvas.focus();
		}
	}

	function toggleFullscreen() {
		if (isFullscreen()) {
			const exit = document.exitFullscreen || document.webkitExitFullscreen;
			const p = exit && exit.call(document);
			if (p && p.catch) {
				p.catch(function () {});
			}
		} else {
			const request = stage.requestFullscreen || stage.webkitRequestFullscreen;
			const p = request && request.call(stage, { navigationUI: 'hide' });
			if (p && p.catch) {
				p.catch(function () {});
			}
		}
		focusGame();
	}

	// --- The loader's states ----------------------------------------------------------------------------------
	let state = 'loading'; // loading, ready, starting, out, gone, error
	let target = 0;
	let shown = 0;
	let readyAt = 0;
	let startAt = 0;
	let outAt = 0;
	let started = false;
	let steady = 0;
	let lastFrame = 0;
	let startedAt = 0;
	let error = null; // { lines: [...], retry: bool }

	function draw(t) {
		ctx.fillStyle = PAL.void;
		ctx.fillRect(0, 0, BASE_W, BASE_H);
		const n = cells.length;
		const nLit = state === 'loading' ? Math.floor(shown * n) : n;
		for (let i = 0; i < n; i++) {
			const cell = cells[i];
			let look = UNLIT;
			if (state !== 'error' && i < nLit) {
				if (cell.litAt < 0) {
					cell.litAt = t;
				}
				look = t - cell.litAt < 0.08 ? FLASH : flicker(i, t);
				if (state === 'starting' && t - startAt < 0.12) {
					look = FLASH;
				}
				if (state === 'out') {
					// The dark eats them east to west, as the title does.
					const e = t - outAt - ((n - 1 - i) * 0.25) / n;
					if (e > 0.1) {
						look = null;
					} else if (e > 0.05) {
						look = UNLIT;
					} else if (e > 0) {
						look = EMBER;
					}
				}
			}
			if (look) {
				drawLuxel(cell.x, cell.y, look);
			}
		}

		if (state === 'loading') {
			const ember = shown < 0.25 ? PAL.night : (shown < 0.5 ? PAL.wine : (shown < 0.8 ? PAL.coral : PAL.apricot));
			drawLantern('dark', ember);
			const pct = Math.min(99, Math.floor(shown * 100));
			drawCentred(ctx, 'LOADING ' + pct + '%', 160, 114, PAL.mauve);
		} else if (state === 'ready') {
			drawLantern('dark', Math.floor(t / 0.14) % 7 === 0 ? PAL.apricot : PAL.gold);
			const pulse = (t - readyAt) % 1.6 < 0.8 ? PAL.cream : PAL.stone;
			drawCentred(ctx, touchOnly ? 'TAP TO LIGHT THE LANTERN' : 'CLICK TO LIGHT THE LANTERN', 160, 114, pulse);
		} else if (state === 'starting' || state === 'out') {
			drawLantern(state === 'starting' && t - startAt < 0.1 ? 'flash' : 'lit', PAL.cream);
		} else if (state === 'error') {
			drawLantern('dark', PAL.night);
			error.lines.forEach(function (line, i) {
				drawCentred(ctx, line, 160, 112 + i * 10 + (i > 0 ? 2 : 0), i === 0 ? PAL.coral : PAL.stone);
			});
			if (error.retry) {
				const pulse = t % 1.6 < 0.8 ? PAL.cream : PAL.stone;
				drawCentred(ctx, touchOnly ? 'TAP TO TRY AGAIN' : 'CLICK TO TRY AGAIN', 160, 154, pulse);
			}
			if (error.detail) {
				drawCentred(ctx, error.detail, 160, 170, PAL.mauve);
			}
		}
		if (touchOnly && (state === 'loading' || state === 'ready')) {
			drawCentred(ctx, 'LUXEL NEEDS A KEYBOARD', 160, 128, PAL.coral);
		}
	}

	function tick(now) {
		const t = now / 1000;
		shown += (target - shown) * 0.12;
		if (Math.abs(target - shown) < 0.002) {
			shown = target;
		}
		if (state === 'starting' && started) {
			// The game has booted once frames come steadily again (loading the main scene blocks the page).
			steady = now - lastFrame < 50 ? steady + 1 : 0;
			if (steady >= 8 || now - startedAt > 8000) {
				handOff(t);
			}
		}
		lastFrame = now;
		if (state === 'gone') {
			return;
		}
		draw(t);
		window.requestAnimationFrame(tick);
	}

	function handOff(t) {
		state = 'out';
		outAt = t;
		loader.classList.remove('gate');
		loader.classList.add('out');
		focusGame();
		wake();
		window.setTimeout(function () {
			state = 'gone';
			loader.style.display = 'none';
		}, 400);
	}

	function fail(kind, err) {
		if (state === 'error') {
			return;
		}
		console.error(err);
		const lines = {
			webgl: ['THE LANTERN WILL NOT LIGHT', 'THIS BROWSER CANNOT RUN WEBGL 2.', 'TRY A RECENT CHROME / FIREFOX / EDGE / SAFARI', 'WITH HARDWARE ACCELERATION ON.'],
			https: ['THE LANTERN WILL NOT LIGHT', 'THIS PAGE MUST BE OPENED OVER HTTPS.'],
			browser: ['THE LANTERN WILL NOT LIGHT', 'THIS BROWSER IS MISSING A FEATURE THE GAME NEEDS.', 'TRY A RECENT CHROME / FIREFOX / EDGE / SAFARI.'],
			download: ['THE GAME DID NOT LOAD', 'CHECK YOUR CONNECTION AND TRY AGAIN.'],
			start: ['SOMETHING WENT WRONG WHILE STARTING', 'RELOAD THE PAGE TO TRY AGAIN.'],
		}[kind];
		error = { lines: lines, retry: kind === 'download' || kind === 'start' };
		state = 'error';
		loader.classList.toggle('gate', error.retry);
		// The raw reason, in the game's font: uppercase, only the glyphs it has, one line.
		const raw = (err instanceof Error ? err.message : String(err || '')).split('\n')[0].toUpperCase();
		error.detail = raw.replace(/[^A-Z0-9!\-:/.+= %]/g, '').replace(/\s+/g, ' ').trim().slice(0, 76);
	}

	// --- The engine -------------------------------------------------------------------------------------------
	const engine = new Engine(Object.assign({}, GODOT_CONFIG, {
		canvas: canvas,
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				target = Math.max(target, Math.min(1, current / total));
			}
		},
	}));
	const exe = GODOT_CONFIG['executable'];
	const pack = GODOT_CONFIG['mainPack'] || exe + '.pck';

	function start() {
		if (state !== 'ready') {
			return;
		}
		state = 'starting';
		startAt = performance.now() / 1000;
		loader.classList.remove('gate');
		focusGame();
		layout();
		// Let the lantern's flash paint first: booting blocks the page until the game's first frame.
		window.setTimeout(function () {
			engine.start({ 'args': ['--main-pack', pack].concat(GODOT_CONFIG['args'] || []) }).then(function () {
				started = true;
				startedAt = performance.now();
				steady = 0;
				layoutKey = '';
				layout();
				focusGame();
			}, function (err) {
				fail('start', err);
			});
		}, 150);
	}

	loader.addEventListener('click', function () {
		if (state === 'ready') {
			start();
		} else if (state === 'error' && error.retry) {
			window.location.reload();
		}
	});
	// Space or Enter also lights it; its repeats and release never reach the game.
	let gateKey = '';
	window.addEventListener('keydown', function (e) {
		const fsKey = (e.altKey && (e.code === 'Enter' || e.code === 'NumpadEnter')) || e.code === 'F11';
		if (fsKey && fsEnabled) {
			e.preventDefault();
			e.stopImmediatePropagation();
			if (!e.repeat) {
				toggleFullscreen();
			}
			return;
		}
		if (state === 'ready' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter')) {
			e.preventDefault();
			gateKey = e.code;
			start();
			return;
		}
		if (gateKey && e.code === gateKey) {
			e.preventDefault();
			e.stopImmediatePropagation();
		}
	}, true);
	window.addEventListener('keyup', function (e) {
		const fsKey = (e.altKey && (e.code === 'Enter' || e.code === 'NumpadEnter')) || e.code === 'F11';
		if ((fsKey && fsEnabled) || (gateKey && e.code === gateKey)) {
			if (e.code === gateKey) {
				gateKey = '';
			}
			e.preventDefault();
			e.stopImmediatePropagation();
		}
	}, true);

	// Clicks on the shell's UI or the letterbox never take focus from the game (a blur pauses it).
	fsButton.addEventListener('mousedown', function (e) {
		e.preventDefault();
	});
	fsButton.addEventListener('click', function (e) {
		e.preventDefault();
		toggleFullscreen();
	});
	fsButton.addEventListener('mouseenter', function () {
		fsHover = true;
		drawFsIcon();
		wake();
	});
	fsButton.addEventListener('mouseleave', function () {
		fsHover = false;
		drawFsIcon();
		wake();
	});
	stage.addEventListener('mousedown', function (e) {
		if (e.target === stage || e.target === hint) {
			e.preventDefault();
			focusGame();
		}
	});
	stage.addEventListener('mousemove', wake);
	window.addEventListener('resize', layout);
	document.addEventListener('fullscreenchange', function () {
		layout();
		drawFsIcon();
		focusGame();
	});
	document.addEventListener('webkitfullscreenchange', function () {
		layout();
		drawFsIcon();
		focusGame();
	});
	if (window.ResizeObserver) {
		new ResizeObserver(layout).observe(stage);
	}
	(function watchPixelRatio() {
		const mq = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
		const again = function () {
			layout();
			watchPixelRatio();
		};
		if (mq.addEventListener) {
			mq.addEventListener('change', again, { once: true });
		}
	}());

	drawHint();
	layout();
	window.requestAnimationFrame(tick);

	const missing = Engine.getMissingFeatures({ 'threads': GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		const all = missing.join('\n');
		fail(/WebGL/.test(all) ? 'webgl' : (/Secure Context/.test(all) ? 'https' : 'browser'), all);
		return;
	}
	Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(function () {
		if (state !== 'loading') {
			return;
		}
		target = 1;
		shown = 1;
		state = 'ready';
		readyAt = performance.now() / 1000;
		loader.classList.add('gate');
	}, function (err) {
		fail('download', err);
	});
}());
	</script>
</body>
</html>
