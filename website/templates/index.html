<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luxel: sell your settings to save the light</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#0d0b1e">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="{{SITE_URL}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Luxel">
<meta property="og:title" content="Luxel: sell your settings to save the light">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{SITE_URL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="LUXEL, written in pixels of light over the Last Light island at night.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Luxel">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="preload" href="assets/fonts/luxel35.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="assets/site.css?v={{V_CSS}}">
<script>document.documentElement.className = "js";</script>
</head>
<body>
<a class="skip btn small" href="#main">SKIP TO CONTENT</a>
<canvas id="sky" class="pix" aria-hidden="true"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="q4" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0 0.2126 0.7152 0.0722 0 0 0.2126 0.7152 0.0722 0 0 0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0.051 0.114 0.298 0.639"/>
      <feFuncG type="discrete" tableValues="0.043 0.239 0.620 0.812"/>
      <feFuncB type="discrete" tableValues="0.118 0.298 0.471 0.490"/>
    </feComponentTransfer>
  </filter>
  <filter id="q2" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0 0.2126 0.7152 0.0722 0 0 0.2126 0.7152 0.0722 0 0 0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0.051 0.051 1"/>
      <feFuncG type="discrete" tableValues="0.043 0.043 0.957"/>
      <feFuncB type="discrete" tableValues="0.118 0.118 0.863"/>
    </feComponentTransfer>
  </filter>
  <filter id="mosaic2" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feFlood x="3" y="3" width="1" height="1"/><feComposite width="6" height="6"/><feTile result="a"/>
    <feComposite in="SourceGraphic" in2="a" operator="in"/><feMorphology operator="dilate" radius="3"/>
  </filter>
  <filter id="mosaic4" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feFlood x="6" y="6" width="1" height="1"/><feComposite width="12" height="12"/><feTile result="a"/>
    <feComposite in="SourceGraphic" in2="a" operator="in"/><feMorphology operator="dilate" radius="6"/>
  </filter>
</svg>
<div id="page">
{{HEADER}}
<main id="main">
{{HERO}}
{{SECTIONS}}
</main>
{{FOOTER}}
</div>
<button id="gear" class="btn small" type="button" aria-haspopup="dialog" aria-controls="sell" title="Sell this website's settings">SETTINGS</button>
<div id="glow" aria-hidden="true"><i class="g4"></i><i class="g3"></i><i class="g2"></i><i class="g1"></i></div>
<div id="toast" role="status" aria-live="polite"><div class="panel px"></div></div>
{{SELL_PANEL}}
<canvas id="eat" aria-hidden="true"></canvas>
<div id="eat-ui" class="panel px" aria-live="polite"></div>
<div id="ending" role="dialog" aria-modal="true" aria-labelledby="ending-title"></div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="btn small x" type="button" data-close>CLOSE</button>
  <img alt="">
  <p class="cap"></p>
</div>
<script id="site-data" type="application/json">{{DATA}}</script>
<script src="assets/site.js?v={{V_JS}}" defer></script>
</body>
</html>
